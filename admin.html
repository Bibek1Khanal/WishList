<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c0d10"><title>Wishlist Manager</title><link rel="stylesheet" href="css/style.css"></head><body><header><nav class="nav"><a class="brand" href="index.html"><span class="brand-mark">W</span> My Wishlist</a><a class="nav-link" href="index.html">← View wishlist</a></nav></header><main class="container admin-page"><section class="page-intro"><p class="eyebrow"><span class="eyebrow-line"></span>Private workspace</p><h1>Wishlist manager<span class="accent-period">.</span></h1><p>Add, update, and remove items from your shared list.</p></section><section class="panel"><div class="panel-heading"><div><p class="eyebrow">Access</p><h2>Admin password</h2></div></div><label for="admin-password">Server password</label><input id="admin-password" type="password" autocomplete="current-password" placeholder="Server ADMIN_PASSWORD"><p class="field-note">Used only for admin changes; this page does not save it.</p></section><section class="panel"><div class="panel-heading"><div><p class="eyebrow">Your collection</p><h2 id="form-heading">Add an item</h2></div></div><form id="item-form"><input type="hidden" id="edit-id"><label for="name">Name<input id="name" required maxlength="100" placeholder="What would you like?"></label><label for="description">Description<textarea id="description" required maxlength="500" placeholder="A few helpful details"></textarea></label><div class="two-col"><label for="price">Price<input id="price" type="number" min="0" step="0.01" placeholder="0.00"></label><label for="image">Image URL<input id="image" type="url" placeholder="https://..."></label></div><label for="url">Product URL<input id="url" type="url" placeholder="https://..."></label><div class="form-actions"><button class="button primary" type="submit">Save item</button><button class="button secondary hidden" id="cancel-edit" type="button">Cancel edit</button></div></form></section><section class="panel"><div class="panel-heading panel-heading-row"><div><p class="eyebrow">Manage</p><h2>Current items</h2><p id="admin-count" class="subline">0 items</p></div><button id="clear-all" class="button danger" type="button">Clear all</button></div><p id="admin-feedback" class="notice hidden" role="status"></p><div id="admin-list"></div></section></main><footer class="site-footer"><span>Wishlist manager</span><a href="index.html">Back to wishlist</a></footer><script src="js/data.js"></script><script src="js/admin.js"></script></body></html>
